
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Arkusze</title>
</head>
<body>

    <h2>Wpisz hasło</h2>

    <input type="password" id="haslo" placeholder="Hasło...">
    <button onclick="sprawdzHaslo()">Zatwierdź</button>

    <p id="komunikat"></p>
    <p>Jeżeli hasło zostanie udostępnione osobom trzecim, hasło zostaniego dezaktywowane!</p>

    <script>
        function sprawdzHaslo() {
            const haslo = document.getElementById("haslo").value;

            const strony = {
                "drg9Oe*J9NXR3T@T": "wybor_arkuszy.html",
                "jH!15hAVlZ_,]T4-_(N_S)": "wybor_arkuszy.html",
                "admin": "notfound.html"
            };

            if (strony[haslo]) {
                window.location.href = strony[haslo];
            } else {
                document.getElementById("komunikat").textContent =
                    "Nieprawidłowe hasło!";
            }
        }
    </script>

</body>
</html>
